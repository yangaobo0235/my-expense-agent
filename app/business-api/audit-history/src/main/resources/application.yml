server:
  port: ${AUDIT_HISTORY_PORT:25104}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
spring:
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../../../.env.local[.properties]
  application:
    name: my-expense-agent-audit-history
  datasource:
    url: ${EXPENSE_DATASOURCE_URL}
    username: ${EXPENSE_DATASOURCE_USERNAME}
    password: ${EXPENSE_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${AUDIT_HISTORY_DATASOURCE_POOL_SIZE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_my_expense_agent_audit
    baseline-on-migrate: true
    baseline-version: 0
expense:
  mcp:
    security:
      service-token: ${EXPENSE_MCP_SERVICE_TOKEN:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
